[package]
name = "ciss"
version = "0.7.0"
edition = "2021"
publish = false
description = "CISS — Croft Item Storage Server: a PDS-like cooperative metered-storage server in Rust (an S3-compatible + atproto blob boundary over the E0–E9 metering ledger). Ports the item-storage protocol; build plan in the discovery repo (2026-07-31-1-plan-coop-metered-storage-service.md)."

# Run `cargo test` / `cargo run` from the repo root.

[workspace]
# The root `ciss` package is the workspace root and a member; `ciss-auth` is the
# authentication crate (ADR 0001): it holds the verified-session/`Principal`
# boundary so authentication can evolve (interim signed session -> atproto
# OAuth/DPoP) without touching the metering core.
members = ["crates/ciss-auth", "crates/ciss-resolve", "crates/ciss-cli", "crates/ciss-sync", "crates/ciss-iroh"]
resolver = "2"

[dependencies]
ciss-auth = { path = "crates/ciss-auth" }
ciss-resolve = { path = "crates/ciss-resolve" }
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
hex = "0.4"
ipld-core = "0.4"
getrandom = "0.2"
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
libc = "0.2"
# Production DID resolution (Phase 5): the reqwest fetcher behind ciss-resolve's
# DidDocFetcher port. rustls (no OpenSSL) keeps the static-build path open.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
async-trait = "0.1"

[dev-dependencies]
# Flow harness (tests/common): mint real secp256k1 service-auth JWTs for the
# atproto persona so Model-R auth is exercised end-to-end over HTTP.
k256 = { version = "0.13", features = ["ecdsa"] }
multibase = "0.9"
base64 = "0.22"
# The sync flow tests (tests/flow_sync_*.rs) drive the real client engine
# against the in-process server. Dev-dep cycles are fine in cargo.
ciss-sync = { path = "crates/ciss-sync" }
ciss-cli = { path = "crates/ciss-cli" }
ciss-iroh = { path = "crates/ciss-iroh" }
async-trait = "0.1"
tempfile = "3"

[profile.release]
# Metering arithmetic must never silently wrap: a wrapped byte count corrupts a
# bill. Overflow is unreachable in practice (byte totals are u64-bounded), so
# this only turns a latent bug into a loud panic (one reset connection, not a
# process kill), never a hot-path cost that matters here.
overflow-checks = true
