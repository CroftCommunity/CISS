[package]
name = "ciss"
version = "0.1.0"
edition = "2021"
publish = false
description = "CISS — Croft Item Storage Server: a PDS-like cooperative metered-storage server in Rust (an S3-compatible + atproto blob boundary over the E0–E9 metering ledger). Ports the item-storage protocol; build plan in the discovery repo (2026-07-31-1-plan-coop-metered-storage-service.md)."

# Standalone crate. Run `cargo test` / `cargo run` from the repo root.

[dependencies]
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
hex = "0.4"
ipld-core = "0.4"
getrandom = "0.2"
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false }
